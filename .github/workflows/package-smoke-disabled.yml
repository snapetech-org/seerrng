# ng-runner-policy: github-hosted-primary-v1
name: Package Smoke Disabled
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate
        required: true

      action_tag:
        description: Action tag for this workflow
        required: true
        type: choice
        options:
          - test
      runner_pool_tag:
        description: GitHub-hosted runner pool tag
        required: true
        type: choice
        options:
          - public
permissions:
  contents: read

jobs:
  disabled:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: packaging/smoke/package-smoke seerrng github-archive "$RELEASE_TAG" --arch amd64
