# ng-runner-policy: private-jit-only-v1
name: Semgrep Community Edition
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - semgrep
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private

permissions:
  contents: read

concurrency:
  group: ng-scan-semgrep-community-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep CE (community rules)
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-semgrep"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          mkdir -p .semgrep-reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e EIO_BACKEND=posix \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/.semgrep-reports:/reports:rw" \
            -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output /reports/semgrep.json --sarif-output /reports/semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('.semgrep-reports/semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Download the semgrep-community-reports artifact to review JSON and SARIF details."' .semgrep-reports/semgrep.json

      - name: Upload scan reports for triage
        if: always() && hashFiles('.semgrep-reports/semgrep.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-community-reports
          path: |
            .semgrep-reports/semgrep.json
            .semgrep-reports/semgrep.sarif
          if-no-files-found: error
          retention-days: 14

