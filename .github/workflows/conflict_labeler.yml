# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Merge Conflict Labeler
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        type: choice
        required: true
        options:
          - merge-conflict-labeler
      runner_pool:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options:
          - private

      action_tag:
        description: Action tag for this workflow
        required: true
        type: choice
        options:
          - run
      runner_pool_tag:
        description: Ephemeral JIT runner-pool tag
        required: true
        type: choice
        options:
          - private
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  label:
    name: Labeling
    if: inputs.action == 'merge-conflict-labeler' && inputs.runner_pool == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-label"]}}', github.run_id)) }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply label
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: 'merge conflict'
          commentOnDirty: 'This pull request has merge conflicts. Please resolve the conflicts so the PR can be successfully reviewed and merged.'
          repoToken: '${{ secrets.GITHUB_TOKEN }}'

