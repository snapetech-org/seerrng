---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or retry
        required: true
        type: string
      announce_security_correction:
        description: Post the security notes omitted from a published release announcement
        required: false
        default: false
        type: boolean
      reuse_from_run_id:
        description: Reuse successful platform artifacts from a failed release run for this exact tag
        required: false
        type: string
        default: ''
      reuse_package_workflow_runs:
        description: JSON map of required package workflow filenames to successful run IDs for this exact tag
        required: false
        type: string
        default: '{}'
      skip_launchpad_dispatch:
        description: Skip starting another PPA run when one is already handling this tag
        required: false
        type: boolean
        default: false
      reuse_published_image:
        description: Reuse the image only after its revision label matches this tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A stale queued retry must not hold the concurrency slot for the current main head.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-main-tag:
    name: Validate main release tag
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && inputs.announce_security_correction != true)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      reuse_windows_x64_artifact: ${{ steps.recovery.outputs.reuse_windows_x64_artifact || 'false' }}
      reuse_windows_arm64_artifact: ${{ steps.recovery.outputs.reuse_windows_arm64_artifact || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Checkout current main alias policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .alias-policy
          persist-credentials: false

      - name: Verify stable container alias policy
        run: node scripts/check-container-alias-policy.mjs
        working-directory: .alias-policy

      - name: Ensure tag is on main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_TYPE" != 'tag' ]]; then
            echo 'Release pushes must originate from a tag.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._+-]{0,126}$ ]]; then
            echo 'Invalid release tag.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "::error::Release tags must point at commits contained in origin/main."
            exit 1
          fi

      - name: Validate previous run artifacts for recovery
        id: recovery
        if: inputs.reuse_from_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REUSE_FROM_RUN_ID: ${{ inputs.reuse_from_run_id }}
        run: |
          set -euo pipefail
          [[ "$REUSE_FROM_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo 'The previous run ID must be numeric.' >&2
            exit 1
          }

          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          run="$(gh api "repos/$REPO/actions/runs/$REUSE_FROM_RUN_ID")"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$release_sha" \
            '.status == "completed" and
             .conclusion == "failure" and
             ((.event == "push" and .head_branch == $tag and .head_sha == $sha) or
              (.event == "workflow_dispatch" and .head_branch == "main"))' <<<"$run" >/dev/null || {
              echo 'The previous run must be a failed release run for this tag on main.' >&2
              exit 1
            }
          source_event="$(jq -r '.event' <<<"$run")"
          source_sha="$(jq -r '.head_sha' <<<"$run")"
          if [[ "$source_event" == 'workflow_dispatch' ]]; then
            git merge-base --is-ancestor "$release_sha" "$source_sha" || {
              echo 'The previous manual release run started before this tag commit.' >&2
              exit 1
            }
            git merge-base --is-ancestor "$source_sha" origin/main || {
              echo 'The previous manual release run is not based on current main history.' >&2
              exit 1
            }
          fi

          jobs="$(gh api "repos/$REPO/actions/runs/$REUSE_FROM_RUN_ID/jobs?per_page=100")"
          reuse_windows_arm64_artifact=false
          if jq -e '
            ([.jobs[] | select(.conclusion == "failure") | .name] ==
              ["Build release assets / Build windows x64"]) and
            (([
              "Validate main release tag",
              "Build release assets / Validate release tag",
              "Build release assets / Build linux x64",
              "Build release assets / Build linux arm64",
              "Build release assets / Build macos arm64",
              "Build release assets / Build macos x64",
              "Build release assets / Build windows arm64",
              "Build release assets / Build Android APK",
              "Build release assets / Build iOS Simulator release package",
              "Build release assets / Build optional Jellyfin plugin"
            ] - [.jobs[] | select(.conclusion == "success") | .name]) | length == 0)
          ' <<<"$jobs" >/dev/null; then
            reuse_windows_x64_artifact=false
            reuse_windows_arm64_artifact=true
          elif jq -e '
            ([.jobs[] | select(.conclusion == "failure") | .name] ==
              ["Build release assets / Upload release assets"]) and
            (([
              "Validate main release tag",
              "Build release assets / Validate release tag",
              "Build release assets / Build linux x64",
              "Build release assets / Build linux arm64",
              "Build release assets / Build macos arm64",
              "Build release assets / Build macos x64",
              "Build release assets / Build windows x64",
              "Build release assets / Build windows arm64",
              "Build release assets / Build Android APK",
              "Build release assets / Build iOS Simulator release package",
              "Build release assets / Build optional Jellyfin plugin",
              "Create draft release"
            ] - [.jobs[] | select(.conclusion == "success") | .name]) | length == 0)
          ' <<<"$jobs" >/dev/null; then
            reuse_windows_x64_artifact=true
            reuse_windows_arm64_artifact=true
          elif jq -e '
            ([.jobs[] | select(.conclusion == "failure") | .name] ==
              ["Dispatch package channels"]) and
            (([
              "Validate main release tag",
              "Generate changelog",
              "Create draft release",
              "Publish multi-arch manifests",
              "Scan release image (linux/amd64)",
              "Scan release image (linux/arm64)",
              "Sign images and create SBOM attestations",
              "Verify signatures and attestations",
              "Build release assets / Validate release tag",
              "Build release assets / Build linux x64",
              "Build release assets / Build linux arm64",
              "Build release assets / Build macos arm64",
              "Build release assets / Build macos x64",
              "Build release assets / Build windows x64",
              "Build release assets / Build windows arm64",
              "Build release assets / Build Android APK",
              "Build release assets / Build iOS Simulator release package",
              "Build release assets / Build optional Jellyfin plugin",
              "Build release assets / Upload release assets"
            ] - [.jobs[] | select(.conclusion == "success") | .name]) | length == 0)
          ' <<<"$jobs" >/dev/null; then
            reuse_windows_x64_artifact=true
            reuse_windows_arm64_artifact=true
          else
            echo 'The previous run did not fail at a supported recoverable release stage.' >&2
            exit 1
          fi
          echo "reuse_windows_x64_artifact=$reuse_windows_x64_artifact" >> "$GITHUB_OUTPUT"
          echo "reuse_windows_arm64_artifact=$reuse_windows_arm64_artifact" >> "$GITHUB_OUTPUT"

          artifacts="$(gh api "repos/$REPO/actions/runs/$REUSE_FROM_RUN_ID/artifacts?per_page=100")"
          if [[ "$reuse_windows_x64_artifact" == true ]]; then
            expected_artifacts='[
              "seerrng-linux-x64",
              "seerrng-linux-arm64",
              "seerrng-macos-arm64",
              "seerrng-macos-x64",
              "seerrng-windows-x64",
              "seerrng-windows-arm64",
              "seerrng-android",
              "seerrng-jellyfin-plugin"
            ]'
          else
            expected_artifacts='[
              "seerrng-linux-x64",
              "seerrng-linux-arm64",
              "seerrng-macos-arm64",
              "seerrng-macos-x64",
              "seerrng-windows-arm64",
              "seerrng-android",
              "seerrng-jellyfin-plugin"
            ]'
          fi
          jq -e --argjson expected "$expected_artifacts" '
            ($expected - [.artifacts[] | select(.expired == false) | .name] | length == 0)
          ' <<<"$artifacts" >/dev/null || {
            echo 'One or more successful builder artifacts are missing or expired.' >&2
            exit 1
          }

  changelog:
    name: Generate changelog
    needs: validate-main-tag
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-body.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: -vv --current
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Add curated release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          previous_tag="$(scripts/latest-published-release-tag.sh)"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$release_sha" \
            --changelog CHANGELOG.md \
            --output CHANGELOG.md

          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' CHANGELOG.md; then
            echo 'Generated release notes contain no changelog entries.' >&2
            exit 1
          fi

      - name: Export release body
        id: release-body
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release_body_${GITHUB_RUN_ID}"
          {
            echo "release_body<<${delimiter}"
            cat CHANGELOG.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  create-draft-release:
    name: Create draft release
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: write
    needs: changelog
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Draft Release
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Release %s.\n\n' "$RELEASE_TAG"
            printf '%s\n\n' "$RELEASE_BODY"
            printf '%s\n' 'Container images are published by this release pipeline; binary assets and package channels follow after asset generation.'
          } > release-notes.md
          test -s release-notes.md
          gh release create "${RELEASE_TAG}" \
            -t "Release ${RELEASE_TAG}" \
            -F release-notes.md \
            --draft || gh release edit "${RELEASE_TAG}" \
            -t "Release ${RELEASE_TAG}" \
            -F release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}

  publish:
    name: Publish multi-arch manifests
    needs: [validate-main-tag, create-draft-release]
    timeout-minutes: 90
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digests.outputs.IMAGE_DIGEST }}
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: release
        shell: bash
        run: echo "SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.DOCKER_HUB }}
            ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}
            org.opencontainers.image.revision=${{ steps.release.outputs.SHA }}

      - name: Build & Push (multi-arch)
        if: inputs.reuse_published_image != true
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          release_sha="${{ steps.release.outputs.SHA }}"
          release_dockerfile="Dockerfile.release"

          mapfile -t pinned_node_refs < <(
            grep -Eo '(public\.ecr\.aws/docker/library/node|mirror\.gcr\.io/library/node):[^[:space:]]+' Dockerfile | sort -u
          )
          ((${#pinned_node_refs[@]} > 0)) || {
            echo 'The release Dockerfile has no digest-pinned Node base image.' >&2
            exit 1
          }
          for pinned_ref in "${pinned_node_refs[@]}"; do
            mirror_ref="$(sed 's#^public.ecr.aws/docker/library/node#mirror.gcr.io/library/node#' <<< "$pinned_ref")"
            echo "Using digest-pinned Node base image: ${mirror_ref}"
          done
          sed 's#public.ecr.aws/docker/library/node#mirror.gcr.io/library/node#g' Dockerfile > "$release_dockerfile"

          build_args=(
            --file "./${release_dockerfile}"
            --platform linux/amd64,linux/arm64
            --output type=registry,oci-mediatypes=false
            --build-arg "COMMIT_TAG=${release_sha}"
            --build-arg "BUILD_VERSION=${{ env.VERSION }}"
            --build-arg "SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance=false
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3 4 5; do
            echo "Building and pushing release image (attempt ${attempt}/5)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Release image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Log out of GHCR before public manifest checks
        shell: bash
        run: docker logout ghcr.io

      - name: Verify and reuse published image for this exact release commit
        if: inputs.reuse_published_image == true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.SHA }}
        run: |
          set -euo pipefail
          image="${GHCR_IMAGE}:${VERSION}"
          docker pull --platform linux/amd64 "$image"
          image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          if [[ "$image_revision" != "$EXPECTED_SHA" ]]; then
            echo "The published image revision does not match the release tag: $image_revision" >&2
            exit 1
          fi
          docker image rm "$image"

      - name: Resolve manifest digest
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          image="${GHCR_IMAGE}:${VERSION}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving release manifest digest (attempt ${attempt}/5)"
            if DIGEST=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the release manifest digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Verify published architectures and Unraid-compatible manifests
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
          REUSE_PUBLISHED_IMAGE: ${{ inputs.reuse_published_image }}
        run: |
          set -euo pipefail
          manifest_requirement='--require-docker-list'
          if [[ "$REUSE_PUBLISHED_IMAGE" == 'true' ]]; then
            manifest_requirement='--require-compatible-manifest'
          fi
          scripts/verify-container-manifest.sh "$manifest_requirement" "${DOCKER_HUB}:${VERSION}" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh "$manifest_requirement" "${GHCR_IMAGE}:${VERSION}" linux/amd64 linux/arm64

  scan-release-image:
    name: Scan release image (${{ matrix.platform }})
    needs: publish
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-release-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}@${{ needs.publish.outputs.image_digest }}"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-release-${{ matrix.suffix }}.sarif
          category: trivy-release-${{ matrix.suffix }}

  sign:
    name: Sign images and create SBOM attestations
    needs: [publish, scan-release-image]
    timeout-minutes: 20
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      COSIGN_YES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign images
        run: |
          cosign sign --recursive "${GHCR_IMAGE}@${{ needs.publish.outputs.image_digest }}"
          cosign sign --recursive "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}"

      - name: Resolve published platform digests
        run: |
          set -euo pipefail
          resolve_platforms() {
            docker buildx imagetools inspect --raw "$1" |
              jq -r '
                .manifests[]
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | [.platform.architecture, .digest]
                | @tsv
              ' | sort
          }
          mapfile -t ghcr_platforms < <(
            resolve_platforms "${GHCR_IMAGE}@${{ needs.publish.outputs.image_digest }}"
          )
          mapfile -t dockerhub_platforms < <(
            resolve_platforms "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}"
          )
          [[ "${#ghcr_platforms[@]}" -eq 2 ]] || exit 1
          [[ "${#dockerhub_platforms[@]}" -eq 2 ]] || exit 1
          diff -u <(printf '%s\n' "${ghcr_platforms[@]}") <(printf '%s\n' "${dockerhub_platforms[@]}")
          printf '%s\n' "${ghcr_platforms[@]}" | grep -Eq '^amd64[[:blank:]]sha256:[0-9a-f]{64}$'
          printf '%s\n' "${ghcr_platforms[@]}" | grep -Eq '^arm64[[:blank:]]sha256:[0-9a-f]{64}$'
          printf '%s\n' "${ghcr_platforms[@]}" > "$RUNNER_TEMP/seerrng-platform-digests"

      - name: Generate and attest per-platform SBOMs
        run: |
          set -euo pipefail
          attest_with_retry() {
            local predicate="$1"
            local image="$2"
            local error_log
            local attempt
            local status
            error_log="$(mktemp)"
            for attempt in 1 2 3; do
              if cosign attest \
                --type cyclonedx \
                --predicate "$predicate" \
                "$image" 2>"$error_log"; then
                cat "$error_log" >&2
                rm -f "$error_log"
                return 0
              else
                status=$?
              fi
              cat "$error_log" >&2
              if ! grep -Eiq 'retrieving ID token|fetching ambient OIDC credentials' "$error_log"; then
                rm -f "$error_log"
                return "$status"
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "Cosign could not fetch the GitHub OIDC token; retrying attestation (attempt $((attempt + 1))/3)."
                sleep "$((attempt * 5))"
              fi
            done
            rm -f "$error_log"
            return "$status"
          }
          while IFS=$'\t' read -r arch digest; do
            ghcr_sbom="seerr-ghcr-${arch}-${{ env.VERSION }}.sbom"
            dockerhub_sbom="seerr-dockerhub-${arch}-${{ env.VERSION }}.sbom"
            trivy image --platform "linux/$arch" --timeout 15m --format cyclonedx \
              --output "$ghcr_sbom" \
              "${GHCR_IMAGE}@$digest"
            trivy image --platform "linux/$arch" --timeout 15m --format cyclonedx \
              --output "$dockerhub_sbom" \
              "${{ env.DOCKER_HUB }}@$digest"
            attest_with_retry "$ghcr_sbom" "${GHCR_IMAGE}@$digest"
            attest_with_retry "$dockerhub_sbom" "${{ env.DOCKER_HUB }}@$digest"
          done < "$RUNNER_TEMP/seerrng-platform-digests"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms-${{ env.VERSION }}
          path: '*.sbom'
          if-no-files-found: error
          retention-days: 1

      - name: Attest GHCR release image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ needs.publish.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub release image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKER_HUB }}
          subject-digest: ${{ needs.publish.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: false

  verify:
    name: Verify signatures and attestations
    needs: [publish, sign]
    timeout-minutes: 15
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signatures
        run: |
          cosign verify "${GHCR_IMAGE}@${{ needs.publish.outputs.image_digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          cosign verify "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.image_digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify GitHub build provenance attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          signer_workflow="${GITHUB_WORKFLOW_REF%%@*}"
          gh attestation verify "oci://${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow"
          gh attestation verify "oci://docker.io/${DOCKER_HUB}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow"

      - name: Verify per-platform SBOM attestations
        run: |
          set -euo pipefail
          resolve_platforms() {
            docker buildx imagetools inspect --raw "$1" |
              jq -r '
                .manifests[]
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | [.platform.architecture, .digest]
                | @tsv
              ' | sort
          }
          for registry_image in \
            "${GHCR_IMAGE}" \
            "${{ env.DOCKER_HUB }}"; do
            mapfile -t platforms < <(
              resolve_platforms "$registry_image@${{ needs.publish.outputs.image_digest }}"
            )
            [[ "${#platforms[@]}" -eq 2 ]] || exit 1
            printf '%s\n' "${platforms[@]}" | grep -Eq '^amd64[[:blank:]]sha256:[0-9a-f]{64}$'
            printf '%s\n' "${platforms[@]}" | grep -Eq '^arm64[[:blank:]]sha256:[0-9a-f]{64}$'
            while IFS=$'\t' read -r arch digest; do
              timeout 5m cosign verify-attestation \
                --type cyclonedx \
                --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$registry_image@$digest" > /dev/null
            done < <(printf '%s\n' "${platforms[@]}")
          done

  publish-release:
    name: Publish release
    needs:
      [create-draft-release, verify, build-release-assets, dispatch-package-channels]
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish release
        run: gh release edit "${{ env.VERSION }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-stable-container-aliases:
    name: Promote stable container aliases
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    needs: [publish-release]
    concurrency:
      group: seerrng-stable-container-aliases
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout current alias tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(scripts/latest-published-release-tag.sh)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Promote and verify stable aliases
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/promote-container-aliases.sh "$VERSION" "$GHCR_IMAGE" "$DOCKER_HUB"

  dispatch-chocolatey:
    name: Dispatch Chocolatey after publication
    needs: [publish-release]
    timeout-minutes: 5
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Chocolatey package workflow
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "Skipping Chocolatey for pre-release tag $TAG."
            exit 0
          fi
          gh workflow run release-chocolatey.yml --repo "$REPO" --ref main -f "tag=$TAG"

  build-release-assets:
    name: Build release assets
    needs: [validate-main-tag, create-draft-release]
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      reuse_from_run_id: ${{ inputs.reuse_from_run_id || '' }}
      reuse_windows_x64_artifact: ${{ needs.validate-main-tag.outputs.reuse_windows_x64_artifact == 'true' }}
      reuse_windows_arm64_artifact: ${{ needs.validate-main-tag.outputs.reuse_windows_arm64_artifact == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_ADHOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 }}
      IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
    permissions:
      actions: read
      contents: write

  dispatch-package-channels:
    name: Dispatch package channels
    needs: [verify, build-release-assets]
    timeout-minutes: 360
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dispatch package workflows
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REUSE_FROM_RUN_ID: ${{ inputs.reuse_from_run_id || '' }}
          REUSE_PACKAGE_WORKFLOW_RUNS: ${{ inputs.reuse_package_workflow_runs || '{}' }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "Skipping stable package channels for pre-release tag $TAG."
            exit 0
          fi
          required_workflows=(
            release-linux-packages.yml \
            release-flatpak.yml \
            release-aur.yml \
            release-copr.yml
          )
          # release-chocolatey.yml is dispatched after the public-release gate.
          # Launchpad is dispatched after publication and the Discord announcement below.
          optional_workflows=(
            release-snap.yml
          )
          declare -A dispatch_started=()
          required_names=()
          required_run_ids=()
          pending_names=()
          allowed_reuse_workflows="$(printf '%s\n' "${required_workflows[@]}" | jq -R . | jq -s .)"
          jq -e --argjson allowed "$allowed_reuse_workflows" '
            type == "object" and
            (keys - $allowed | length == 0) and
            all(.[]; (tostring | test("^[0-9]+$")))
          ' <<<"$REUSE_PACKAGE_WORKFLOW_RUNS" >/dev/null || {
            echo 'Reusable package workflows must be a JSON object of required workflow names to numeric run IDs.' >&2
            exit 1
          }

          for workflow in "${required_workflows[@]}"; do
            reused_run_id="$(jq -r --arg workflow "$workflow" '.[$workflow] // empty' <<<"$REUSE_PACKAGE_WORKFLOW_RUNS")"
            if [[ -n "$reused_run_id" ]]; then
              run_json="$(gh api "repos/$REPO/actions/runs/$reused_run_id")"
              workflow_path=".github/workflows/$workflow"
              jq -e --arg workflow_path "$workflow_path" '
                .path == $workflow_path and
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .status == "completed" and
                .conclusion == "success"
              ' <<<"$run_json" >/dev/null || {
                echo "Refusing to reuse unsuccessful or mismatched package workflow run $reused_run_id for $workflow." >&2
                exit 1
              }
              run_logs="$(gh run view "$reused_run_id" --repo "$REPO" --log)"
              grep -Fq "RELEASE_TAG: $TAG" <<<"$run_logs" || {
                echo "Refusing to reuse $workflow run $reused_run_id because its logs do not confirm tag $TAG." >&2
                exit 1
              }
              echo "Reusing verified $workflow run $reused_run_id for $TAG."
              required_names+=("$workflow")
              required_run_ids+=("$reused_run_id")
              continue
            fi

            dispatch_started["$workflow"]="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! gh workflow run "$workflow" --repo "$REPO" --ref main -f "tag=$TAG"; then
              exit 1
            fi
            echo "Dispatched $workflow for $TAG."
            pending_names+=("$workflow")
          done

          for workflow in "${optional_workflows[@]}"; do
            if [[ "$workflow" == 'release-snap.yml' && ( -n "$REUSE_FROM_RUN_ID" || "$REUSE_PACKAGE_WORKFLOW_RUNS" != '{}' ) ]]; then
              echo 'Skipping optional Snap workflow during release recovery.'
              continue
            fi
            dispatch_started["$workflow"]="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! gh workflow run "$workflow" --repo "$REPO" --ref main -f "tag=$TAG"; then
              echo "::warning::Optional package workflow $workflow could not be dispatched; continuing."
              continue
            fi
            echo "Dispatched optional $workflow for $TAG."
          done

          for workflow in "${pending_names[@]}"; do
            run_id=""
            for attempt in {1..60}; do
              runs_json="$(gh api "repos/$REPO/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=20")"
              run_id="$(jq -r --arg started "${dispatch_started[$workflow]}" '
                [.workflow_runs[]
                  | select(.created_at >= $started and .head_branch == "main")
                ]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' <<<"$runs_json")"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done
            if [[ -z "$run_id" ]]; then
              echo "Unable to find the dispatched $workflow run." >&2
              exit 1
            fi
            required_names+=("$workflow")
            required_run_ids+=("$run_id")
          done

          watcher_pids=()
          for index in "${!required_run_ids[@]}"; do
            workflow="${required_names[$index]}"
            run_id="${required_run_ids[$index]}"
            (
              echo "Waiting for required $workflow run $run_id"
              node scripts/watch-github-run.mjs "$REPO" "$run_id"
            ) &
            watcher_pids+=("$!")
          done

          dispatch_status=0
          for index in "${!watcher_pids[@]}"; do
            if ! wait "${watcher_pids[$index]}"; then
              echo "::error::Required package workflow ${required_names[$index]} failed."
              dispatch_status=1
            fi
          done
          (( dispatch_status == 0 )) || exit 1

      - name: Verify release package assets
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          IOS_ADHOC_SIGNING_ENABLED: ${{ vars.IOS_ADHOC_SIGNING_ENABLED }}
          IOS_APPSTORE_SIGNING_ENABLED: ${{ vars.IOS_APPSTORE_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-* ]]; then
            echo "Stable package assets are not required for pre-release tag $TAG."
            exit 0
          fi
          version="${TAG#v}"
          for attempt in {1..20}; do
            assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            required=(
              "seerrng-${TAG}-linux-x64.tar.gz"
              "seerrng-${TAG}-linux-x64.sha256"
              "seerrng-${TAG}-linux-arm64.tar.gz"
              "seerrng-${TAG}-linux-arm64.sha256"
              "seerrng-${TAG}-macos-arm64.tar.gz"
              "seerrng-${TAG}-macos-arm64.sha256"
              "seerrng-${TAG}-macos-x64.tar.gz"
              "seerrng-${TAG}-macos-x64.sha256"
              "seerrng-${TAG}-windows-x64.zip"
              "seerrng-${TAG}-windows-x64.sha256"
              "seerrng-${TAG}-windows-arm64.zip"
              "seerrng-${TAG}-windows-arm64.sha256"
              "seerrng-${TAG}-ios-simulator.zip"
              "seerrng-${TAG}-ios-simulator.sha256"
              "seerrng_${version}_amd64.deb"
              "seerrng_${version}_amd64.deb.sha256"
              "SeerrNG-${version}-x86_64.AppImage"
              "SeerrNG-${version}-x86_64.AppImage.sha256"
              "SeerrNG-${version}-x86_64.flatpak"
              "SeerrNG-${version}-x86_64.flatpak.sha256"
            )
            required+=(
              "seerrng-${TAG}-android.apk"
              "seerrng-${TAG}-android.sha256"
              "seerrng-${TAG}-android.aab"
              "seerrng-${TAG}-android-aab.sha256"
            )
            if [[ "$IOS_ADHOC_SIGNING_ENABLED" == 'true' ]]; then
              required+=("seerrng-${TAG}-ios-adhoc.ipa" "seerrng-${TAG}-ios-adhoc.sha256")
            fi
            if [[ "$IOS_APPSTORE_SIGNING_ENABLED" == 'true' ]]; then
              required+=("seerrng-${TAG}-ios-appstore.ipa" "seerrng-${TAG}-ios-appstore.sha256")
            fi
            missing=()
            for asset in "${required[@]}"; do
              grep -Fxq "$asset" <<<"$assets" || missing+=("$asset")
            done
            if ! grep -Eq "^seerrng-${version}-.*\\.rpm$" <<<"$assets" ||
              ! grep -Eq "^seerrng-${version}-.*\\.rpm\\.sha256$" <<<"$assets"; then
              missing+=("RPM and checksum sidecars")
            fi
            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "Verified release asset inventory for $TAG."
              exit 0
            fi
            printf 'Waiting for release assets (%s/20); missing: %s\n' "$attempt" "${missing[*]}"
            sleep 15
          done
          echo "Release asset inventory is incomplete for $TAG." >&2
          exit 1

  announce-discord:
    name: Announce release to Discord
    needs:
      [changelog, publish, publish-release]
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
      RELEASE_BODY: ${{ needs.changelog.outputs.release_body }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Send Discord announcement
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION}"
          image_ref="${GHCR_IMAGE}:${VERSION}"
          printf '%s' "$RELEASE_BODY" | node scripts/discord-release-notes.mjs --split > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index += 1)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="SeerrNG ${VERSION} release notes ($number/$chunk_count)"
            jq -n \
              --arg username "SeerrNG Releases" \
              --arg title "$title" \
              --arg url "$release_url" \
              --arg description "$description" \
              --arg image "$image_ref" \
              --arg digest "$IMAGE_DIGEST" \
              --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Digest", value: $digest, inline: false },
                    { name: "Workflow", value: $run_url, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done

  dispatch-launchpad-ppa:
    name: Dispatch Launchpad PPA after announcement
    if: ${{ !cancelled() && !contains(inputs.tag || github.ref_name, '-') && needs.publish-release.result == 'success' }}
    needs: [publish-release, announce-discord]
    timeout-minutes: 5
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Launchpad PPA
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          SKIP_LAUNCHPAD_DISPATCH: ${{ inputs.skip_launchpad_dispatch || false }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_LAUNCHPAD_DISPATCH" == 'true' ]]; then
            echo "Skipping Launchpad PPA dispatch for $TAG; an existing run is already handling it."
            exit 0
          fi
          if ! gh workflow run release-ppa.yml --repo "$REPO" --ref main -f "tag=$TAG"; then
            echo "::warning::Launchpad PPA could not be dispatched for the already-published release $TAG."
            exit 0
          fi
          echo "Dispatched Launchpad PPA for $TAG after the announcement attempt."


  announce-security-correction:
    name: Correct published Discord security notes
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.announce_security_correction == true
    timeout-minutes: 10
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Post omitted security notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'Security-note corrections must run from main.' >&2
            exit 1
          }
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._+-]{0,126}$ ]] || {
            echo 'Invalid release tag.' >&2
            exit 1
          }
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to correct a release announcement.' >&2
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.body' > release-body.md
          security_notes="$(awk '
            /^#### Security$/ { active = 1; next }
            active && /^#### / { exit }
            active { print }
          ' release-body.md)"
          test -n "${security_notes//[[:space:]]/}" || {
            echo "No security release notes were found for ${TAG}." >&2
            exit 1
          }

          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          body="Correction: the original ${TAG} Discord announcement was truncated."$'\n\n'"#### Security"$'\n'"${security_notes}"$'\n\n'"Full release notes: ${release_url}"
          printf '%s' "$body" | node scripts/discord-release-notes.mjs --split > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index += 1)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="Correction: SeerrNG ${TAG} security notes ($number/$chunk_count)"
            jq -n \
              --arg username "SeerrNG Releases" \
              --arg title "$title" \
              --arg url "$release_url" \
              --arg description "$description" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 16742144
                }]
              }' > payload.json
            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
