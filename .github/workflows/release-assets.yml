# ng-runner-policy: hosted-first-v1
name: Build Release Assets

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      reuse_from_run_id:
        description: Validated prior release run whose successful builder artifacts can be reused
        required: false
        type: string
        default: ''
      reuse_windows_x64_artifact:
        description: Reuse the successful Windows x64 artifact from the prior run
        required: false
        type: boolean
        default: false
      reuse_windows_arm64_artifact:
        description: Reuse the successful Windows ARM64 artifact from the prior run
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_BASE64:
        required: false
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:
        required: false
      IOS_TEAM_ID:
        required: false
      IOS_ADHOC_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_APPSTORE_PROVISIONING_PROFILE_BASE64:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Validate release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$TAG"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tag $TAG is not reachable from main." >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && matrix.os == 'macos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple"]}}')) || ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && matrix.os == 'linux' && matrix.arch == 'x64' && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || matrix.runner) }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            pnpm_version: 10.24.0
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            pnpm_version: 10.24.0
          - runner: macos-15
            os: macos
            arch: arm64
            pnpm_version: 10.24.0
          - runner: macos-15-intel
            os: macos
            arch: x64
            pnpm_version: 10.24.0
          - runner: windows-2022
            os: windows
            arch: x64
            pnpm_version: 10.24.0
            msvs_version: auto
          - runner: windows-11-vs2026-arm
            os: windows
            arch: arm64
            pnpm_version: 10.24.0
            msvs_version: '2026'
    steps:
      - name: Download validated artifacts from previous run
        if: inputs.reuse_from_run_id != '' && (matrix.os != 'windows' || (matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact == true) || (matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact == true))
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        with:
          node-version-file: 'package.json'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false

      - name: Checkout release tooling
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts
          persist-credentials: false

      - name: Prepare isolated pnpm package metadata
        if: (inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)) && matrix.os == 'windows'
        shell: bash
        run: |
          cat > .github/release-pnpm-tooling.json <<'JSON'
          {
            "name": "seerrng-release-tooling",
            "private": true
          }
          JSON

      - name: Pnpm Setup
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ matrix.pnpm_version }}
          package_json_file: ${{ matrix.os == 'windows' && '.github/release-pnpm-tooling.json' || 'package.json' }}

      - name: Verify pinned pnpm runtime
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        shell: bash
        env:
          EXPECTED_PNPM_VERSION: ${{ matrix.pnpm_version }}
        run: |
          set -euo pipefail
          case "$EXPECTED_PNPM_VERSION" in
            10.*) export npm_config_manage_package_manager_versions=false ;;
            *) echo "Unsupported pnpm version for release build: $EXPECTED_PNPM_VERSION" >&2; exit 1 ;;
          esac
          actual_version="$(pnpm --version)"
          printf 'Using pnpm %s from %s\n' "$actual_version" "$(command -v pnpm)"
          [[ "$actual_version" == "$EXPECTED_PNPM_VERSION" ]] || {
            echo "Expected pnpm $EXPECTED_PNPM_VERSION, got $actual_version." >&2
            exit 1
          }

      - name: Verify runner platform
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual_platform="$(node -p 'process.platform')"
          actual_arch="$(node -p 'process.arch')"
          case "$EXPECTED_OS" in
            linux) expected_platform=linux ;;
            macos) expected_platform=darwin ;;
            windows) expected_platform=win32 ;;
            *) echo "Unsupported release OS matrix value: $EXPECTED_OS" >&2; exit 1 ;;
          esac
          [[ "$actual_platform" == "$expected_platform" ]] || {
            echo "Release runner platform mismatch: expected $expected_platform, got $actual_platform" >&2
            exit 1
          }
          [[ "$actual_arch" == "$EXPECTED_ARCH" ]] || {
            echo "Release runner architecture mismatch: expected $EXPECTED_ARCH, got $actual_arch" >&2
            exit 1
          }

      - name: Install node-gyp for Visual Studio 2026
        if: matrix.os == 'windows' && matrix.arch == 'arm64' && (inputs.reuse_from_run_id == '' || inputs.reuse_windows_arm64_artifact != true)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts node-gyp@13.0.1
          npm_root="$(npm root --global | tr -d '\r')"
          node_gyp_js="$(cygpath -u "$npm_root")/node-gyp/bin/node-gyp.js"
          test -f "$node_gyp_js"
          node_gyp_version="$(node "$node_gyp_js" --version)"
          printf 'Using node-gyp %s from %s\n' "$node_gyp_version" "$node_gyp_js"
          [[ "$node_gyp_version" == 'v13.0.1' ]]
          printf 'npm_config_node_gyp=%s\n' "$(cygpath -w "$node_gyp_js")" >> "$GITHUB_ENV"
          printf 'npm_config_msvs_version=2026\n' >> "$GITHUB_ENV"

      - name: Build archive
        if: inputs.reuse_from_run_id == '' || (matrix.os == 'windows' && matrix.arch == 'x64' && inputs.reuse_windows_x64_artifact != true) || (matrix.os == 'windows' && matrix.arch == 'arm64' && inputs.reuse_windows_arm64_artifact != true)
        shell: bash
        env:
          EXPECTED_PNPM_VERSION: ${{ matrix.pnpm_version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SEERRNG_RELEASE_ARCH: ${{ matrix.arch }}
          GYP_MSVS_VERSION: ${{ matrix.msvs_version || 'auto' }}
        run: |
          set -euo pipefail
          case "$EXPECTED_PNPM_VERSION" in
            10.*) export npm_config_manage_package_manager_versions=false ;;
            *) echo "Unsupported pnpm version for release build: $EXPECTED_PNPM_VERSION" >&2; exit 1 ;;
          esac
          actual_version="$(pnpm --version)"
          printf 'Building with pnpm %s from %s\n' "$actual_version" "$(command -v pnpm)"
          [[ "$actual_version" == "$EXPECTED_PNPM_VERSION" ]] || {
            echo "Expected pnpm $EXPECTED_PNPM_VERSION, got $actual_version." >&2
            exit 1
          }
          bash .release-tooling/scripts/build-release-assets.sh "${TAG}" dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seerrng-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release/seerrng-*

  build-android:
    name: Build Android APK
    needs: resolve
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build, sign, and checksum the Android APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ENABLE_PLAY_BILLING: ${{ vars.ENABLE_PLAY_BILLING }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/build-android-release.sh '${{ needs.resolve.outputs.tag }}' dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seerrng-android
          path: dist-release/seerrng-*-android*
          if-no-files-found: error

  build-ios:
    name: Build iOS Simulator release package
    needs: resolve
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"private-apple-builds","labels":["self-hosted","macOS","ARM64","private-apple"]}}')) || 'macos-26' }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Verify Xcode release toolchain
        run: |
          set -euo pipefail
          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version_output"
          grep -Eq '^Xcode 2[6-9](\.|$)' <<<"$xcode_version_output"
          available_simulators="$(xcrun simctl list devices available)"
          grep -Fq 'iPhone 17' <<<"$available_simulators"

      - name: Test and package iOS Simulator app
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_SIMULATOR_NAME: iPhone 17
        run: bash scripts/build-ios-release.sh "$TAG" dist-release

      - name: Build signed Ad Hoc IPA
        if: vars.IOS_ADHOC_SIGNING_ENABLED == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_DISTRIBUTION_KIND: adhoc
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_ADHOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/build-ios-signed-ipa.sh "$TAG" dist-release

      - name: Build signed App Store Connect IPA
        if: vars.IOS_APPSTORE_SIGNING_ENABLED == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          IOS_DISTRIBUTION_KIND: app-store-connect
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/build-ios-signed-ipa.sh "$TAG" dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-ios-simulator
          path: |
            dist-release/seerrng-*-ios-simulator.zip
            dist-release/seerrng-*-ios-simulator.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.IOS_ADHOC_SIGNING_ENABLED == 'true'
        with:
          name: seerrng-ios-adhoc
          path: dist-release/seerrng-*-ios-adhoc.ipa*
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.IOS_APPSTORE_SIGNING_ENABLED == 'true'
        with:
          name: seerrng-ios-appstore
          path: dist-release/seerrng-*-ios-appstore.ipa*
          if-no-files-found: error

  build-jellyfin-plugin:
    name: Build optional Jellyfin plugin
    needs: resolve
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download validated Jellyfin plugin artifact from previous run
        if: inputs.reuse_from_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: seerrng-jellyfin-plugin
          path: dist-release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_from_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.reuse_from_run_id == ''
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: inputs.reuse_from_run_id == ''
        with:
          dotnet-version: 9.0.x

      - name: Build plugin archive and repository manifest
        if: inputs.reuse_from_run_id == ''
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          plugin_dir='integrations/jellyfin-plugin'
          release_dir='dist-release'
          plugin_version="$(jq -er '.version' "$plugin_dir/meta.json")"
          target_abi="$(jq -er '.targetAbi' "$plugin_dir/meta.json")"
          plugin_guid="$(jq -er '.guid' "$plugin_dir/meta.json")"
          [[ "$plugin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$target_abi" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$plugin_guid" == '812a21b1-2e18-4ff7-a9b8-3dd84e2a0e16' ]]
          mkdir -p "$release_dir/plugin"
          dotnet publish "$plugin_dir/SeerrNG.JellyfinBridge.csproj" \
            --configuration Release \
            --output "$release_dir/plugin"
          test -s "$release_dir/plugin/Jellyfin.Plugin.SeerrNGBridge.dll"
          cp "$plugin_dir/meta.json" "$release_dir/plugin/meta.json"
          archive="seerrng-jellyfin-bridge-${RELEASE_TAG}.zip"
          (
            cd "$release_dir/plugin"
            zip -q "../$archive" Jellyfin.Plugin.SeerrNGBridge.dll meta.json
          )
          (
            cd "$release_dir"
            sha256sum "$archive" > "${archive%.zip}.sha256"
          )
          checksum="$(md5sum "$release_dir/$archive" | cut -d ' ' -f1)"
          [[ "$checksum" =~ ^[a-f0-9]{32}$ ]]
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${archive}"
          jq -n \
            --arg guid "$plugin_guid" \
            --arg version "$plugin_version" \
            --arg targetAbi "$target_abi" \
            --arg sourceUrl "$source_url" \
            --arg checksum "$checksum" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{
              guid: $guid,
              name: "SeerrNG Bridge",
              description: "Optional Jellyfin menu link to a separately deployed SeerrNG server.",
              overview: "Open SeerrNG using the current Jellyfin session.",
              owner: "snapetech",
              category: "General",
              versions: [{
                version: $version,
                changelog: "Initial SeerrNG Jellyfin Bridge release.",
                targetAbi: $targetAbi,
                sourceUrl: $sourceUrl,
                checksum: $checksum,
                timestamp: $timestamp
              }]
            }]' > "$release_dir/seerrng-jellyfin-plugin-manifest.json"
          jq -e --arg guid "$plugin_guid" --arg checksum "$checksum" \
            'length == 1 and .[0].guid == $guid and .[0].versions[0].checksum == $checksum' \
            "$release_dir/seerrng-jellyfin-plugin-manifest.json" >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: seerrng-jellyfin-plugin
          path: dist-release/seerrng-jellyfin-*

  publish:
    name: Upload release assets
    needs: [resolve, build, build-android, build-ios, build-jellyfin-plugin]
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seerrng-*
          path: dist-release/downloaded

      - name: Flatten downloaded release assets
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IOS_ADHOC_SIGNING_ENABLED: ${{ vars.IOS_ADHOC_SIGNING_ENABLED }}
          IOS_APPSTORE_SIGNING_ENABLED: ${{ vars.IOS_APPSTORE_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          release_dir='dist-release'
          downloads="$release_dir/downloaded"
          while IFS= read -r -d '' file; do
            filename="${file##*/}"
            artifact="${file#"$downloads"/}"
            artifact="${artifact%%/*}"
            expected_manifest=""
            case "$artifact" in
              seerrng-linux-x64) expected_archives=("seerrng-${TAG}-linux-x64.tar.gz") ;;
              seerrng-linux-arm64) expected_archives=("seerrng-${TAG}-linux-arm64.tar.gz") ;;
              seerrng-macos-x64) expected_archives=("seerrng-${TAG}-macos-x64.tar.gz") ;;
              seerrng-macos-arm64) expected_archives=("seerrng-${TAG}-macos-arm64.tar.gz") ;;
              seerrng-windows-x64) expected_archives=("seerrng-${TAG}-windows-x64.zip") ;;
              seerrng-windows-arm64) expected_archives=("seerrng-${TAG}-windows-arm64.zip") ;;
              seerrng-android)
                expected_archives=("seerrng-${TAG}-android.apk" "seerrng-${TAG}-android.aab")
                ;;
              seerrng-ios-simulator) expected_archives=("seerrng-${TAG}-ios-simulator.zip") ;;
              seerrng-ios-adhoc) expected_archives=("seerrng-${TAG}-ios-adhoc.ipa") ;;
              seerrng-ios-appstore) expected_archives=("seerrng-${TAG}-ios-appstore.ipa") ;;
              seerrng-jellyfin-plugin) expected_archive="seerrng-jellyfin-bridge-${TAG}.zip"; expected_manifest='seerrng-jellyfin-plugin-manifest.json' ;;
              *) echo "Unexpected release artifact directory: $artifact" >&2; exit 1 ;;
            esac
            if [[ "$artifact" != 'seerrng-jellyfin-plugin' ]]; then
              expected_files=()
              for expected_archive in "${expected_archives[@]}"; do
                checksum_base="${expected_archive%.tar.gz}"
                checksum_base="${checksum_base%.zip}"
                checksum_base="${checksum_base%.apk}"
                checksum_base="${checksum_base%.ipa}"
                if [[ "$expected_archive" == *.aab ]]; then
                  checksum_base="${checksum_base%.aab}-aab"
                else
                  checksum_base="${checksum_base%.aab}"
                fi
                expected_files+=("$expected_archive" "${checksum_base}.sha256")
              done
            else
              expected_files=("$expected_archive" "${expected_archive%.zip}.sha256")
            fi
            file_allowed=false
            for expected_file in "${expected_files[@]}"; do
              if [[ "$filename" == "$expected_file" ]]; then
                file_allowed=true
                break
              fi
            done
            if [[ "$filename" == "$expected_manifest" && -n "$expected_manifest" ]]; then
              file_allowed=true
            fi
            if [[ "$file_allowed" != true ]]; then
              echo "Unexpected file in release artifact $artifact: $filename (expected ${expected_files[*]} $expected_manifest)" >&2
              exit 1
            fi
            target="$release_dir/$filename"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset filename $filename: $file collides with $target" >&2
              exit 1
            fi
            cp -- "$file" "$target"
          done < <(find "$downloads" -type f -name 'seerrng-*' -print0)

      - name: Verify archive inventory and checksums
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          IOS_ADHOC_SIGNING_ENABLED: ${{ vars.IOS_ADHOC_SIGNING_ENABLED }}
          IOS_APPSTORE_SIGNING_ENABLED: ${{ vars.IOS_APPSTORE_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          expected=(
            "seerrng-${TAG}-linux-x64.tar.gz"
            "seerrng-${TAG}-linux-arm64.tar.gz"
            "seerrng-${TAG}-macos-arm64.tar.gz"
            "seerrng-${TAG}-macos-x64.tar.gz"
            "seerrng-${TAG}-windows-x64.zip"
            "seerrng-${TAG}-windows-arm64.zip"
            "seerrng-${TAG}-ios-simulator.zip"
            "seerrng-jellyfin-bridge-${TAG}.zip"
          )
          expected+=(
            "seerrng-${TAG}-android.apk"
            "seerrng-${TAG}-android.aab"
          )
          if [[ "${IOS_ADHOC_SIGNING_ENABLED:-}" == 'true' ]]; then
            expected+=("seerrng-${TAG}-ios-adhoc.ipa")
          fi
          if [[ "${IOS_APPSTORE_SIGNING_ENABLED:-}" == 'true' ]]; then
            expected+=("seerrng-${TAG}-ios-appstore.ipa")
          fi
          for archive in "${expected[@]}"; do
            test -f "dist-release/$archive"
            archive_base="${archive%.tar.gz}"
            archive_base="${archive_base%.zip}"
            archive_base="${archive_base%.apk}"
            archive_base="${archive_base%.ipa}"
            if [[ "$archive" == *.aab ]]; then
              archive_base="${archive_base%.aab}-aab"
            else
              archive_base="${archive_base%.aab}"
            fi
            checksum="dist-release/$archive_base.sha256"
            test -f "$checksum"
            (
              cd dist-release
              sha256sum -c "$(basename "$checksum")"
            )
          done
          mapfile -t archives < <(find dist-release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -printf '%f\n' | sort)
          printf '%s\n' "${archives[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${archives[@]}")

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          draft: true
          files: |
            dist-release/seerrng-*
