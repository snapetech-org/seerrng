# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test Docs
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: test-docs-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  test-build:
    name: Build and test docs website
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-test-build"]}}', github.run_id)) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install docs dependencies
        working-directory: gen-docs
        run: pnpm install --frozen-lockfile
      - name: Test image parser boundaries
        working-directory: gen-docs
        run: pnpm test:security
      - name: Build docs website
        working-directory: gen-docs
        run: pnpm gen-api-docs && pnpm build

