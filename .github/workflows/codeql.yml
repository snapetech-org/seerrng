---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'CodeQL'

on:
  workflow_call:
    inputs:
      plan_sha256:
        required: true
        type: string
      engine_run_id:
        required: true
        type: string
      engine_run_attempt:
        required: true
        type: string
      execution_sha:
        required: true
        type: string
      unit_id:
        required: true
        type: string
  schedule:
    - cron: '50 7 * * 5'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript]
    env:
      SEERRNG_ENGINE_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      SEERRNG_ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
      SEERRNG_ENGINE_RUN_ATTEMPT: ${{ inputs.engine_run_attempt }}
      SEERRNG_ENGINE_EXECUTION_SHA: ${{ inputs.execution_sha }}
      SEERRNG_ENGINE_UNIT_ID: ${{ inputs.unit_id }}
      SEERRNG_ENGINE_CASE: ${{ matrix.language }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for engine binding
        if: inputs.plan_sha256 != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Download immutable validation plan
        if: inputs.plan_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seerrng-engine-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.language || 'single' }}/plan

      - name: Admit engine unit case
        id: engine-admission
        if: inputs.plan_sha256 != ''
        run: >-
          node bin/run-local-validation.mjs
          --github-admit
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --json

      - name: Initialize CodeQL
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          packs: ${{ matrix.language == 'javascript' && 'snapetech/seerrng-codeql-models@0.0.15' || '' }}
          token: ${{ github.token }}

      - name: Autobuild
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        if: >-
          inputs.plan_sha256 == '' ||
          steps.engine-admission.outputs.execute == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:${{ matrix.language }}'

      - name: Seal engine unit case receipt
        if: >-
          always() &&
          inputs.plan_sha256 != '' &&
          steps.engine-admission.outputs.execute == 'true'
        run: >-
          node bin/run-local-validation.mjs
          --github-receipt
          --unit "$SEERRNG_ENGINE_UNIT_ID"
          --case "$SEERRNG_ENGINE_CASE"
          --plan-file "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/plan/hosted-plan.json"
          --expected-plan-sha256 "$SEERRNG_ENGINE_PLAN_SHA256"
          --receipt-dir "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}/receipts"
          --job-status "${{ job.status }}"
          --json

      - name: Publish engine unit case receipt
        if: always() && inputs.plan_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerrng-engine-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.unit_id }}-${{ matrix.language }}
          path: ${{ runner.temp }}/seerrng-engine-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.language || 'single' }}/receipts
          if-no-files-found: error
          retention-days: 1

      - name: Clean attempt-scoped engine workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/seerrng-engine-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${SEERRNG_ENGINE_CASE_ID:-${SEERRNG_ENGINE_CASE:-single}}"
