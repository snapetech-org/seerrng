# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Check Docs Links
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_call:
  workflow_dispatch:
    inputs:

      action_tag:
        description: Action tag for this workflow
        required: true
        type: choice
        options:
          - run
      runner_pool_tag:
        description: Ephemeral JIT runner-pool tag
        required: true
        type: choice
        options:
          - private
permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  link-check:
    name: Verify external links in Markdown and MDX
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-link-check"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lychee reads the current docs; downloading full history is unnecessary.
          fetch-depth: 1
          persist-credentials: false

      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          args: >-
            --verbose
            --no-progress
            --accept 200..204,300..304,307,308,404,429,999
            --exclude '^file://'
            --exclude '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|\[::\])'
            --exclude '^https?://support\.discord\.com'
            './docs/**/*.md'
            './docs/**/*.mdx'
            './gen-docs/**/*.md'
            './gen-docs/**/*.mdx'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Lychee report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lychee-report
          path: |
            lychee/out.md
            lychee/results.json
          if-no-files-found: ignore

