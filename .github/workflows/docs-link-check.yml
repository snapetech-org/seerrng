# ng-runner-policy: github-hosted-primary-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Check Docs Links
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_call:
    inputs:
      pr_sha:
        description: Exact trusted owner PR head SHA to validate
        required: false
        type: string
  workflow_dispatch:
    inputs:

      action_tag:
        description: Action tag for this workflow
        required: true
        type: choice
        options:
          - run
      runner_pool_tag:
        description: GitHub-hosted runner pool tag
        required: true
        type: choice
        options:
          - public
permissions:
  contents: read

concurrency:
  group: docs-links-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  link-check:
    name: Verify external links in Markdown and MDX
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          # Lychee reads the current docs; downloading full history is unnecessary.
          fetch-depth: 1
          persist-credentials: false

      - name: Install verified Lychee
        uses: ./.github/actions/setup-lychee

      - name: Run Lychee link checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p lychee
          status=0
          lychee --mode task --format markdown --output lychee/out.md \
            --verbose --no-progress \
            --accept 200..204,300..304,307,308,404,429,999 \
            --exclude '^file://' \
            --exclude '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|\[::\])' \
            --exclude '^https?://support\.discord\.com' \
            './docs/**/*.md' './docs/**/*.mdx' \
            './gen-docs/**/*.md' './gen-docs/**/*.mdx' || status=$?
          test -s lychee/out.md
          if grep -Eq 'Total\s+\|\s+0' lychee/out.md; then
            echo 'No documentation links were found.' >&2
            exit 1
          fi
          cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"
          # Preserve the existing advisory link-result policy (formerly fail: false).
          echo "Lychee completed with advisory exit code $status"

      - name: Upload Lychee report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lychee-report
          path: |
            lychee/out.md
            lychee/results.json
          if-no-files-found: ignore

