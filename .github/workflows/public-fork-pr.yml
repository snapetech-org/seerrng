name: Public fork PR validation
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  validate:
    name: Build and test docs website
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/seerrng' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    uses: snapetech-org/seerrng/.github/workflows/test-docs.yml@265d4696ebe870ee28ab67790ff0fd56f2ee6670
