# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Trivy Container Vulnerability Scan
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - trivy
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng

jobs:
  trivy:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    name: Scan latest container image (${{ matrix.platform }})
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-{1}-trivy"]}}', github.run_id, strategy.job-index)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64

    permissions:
      contents: read
      packages: read

    env:
      TRIVY_CACHE_DIR: .trivycache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}:latest"

      - name: Retain Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.suffix }}-sarif
          path: trivy-${{ matrix.suffix }}.sarif
          if-no-files-found: warn
