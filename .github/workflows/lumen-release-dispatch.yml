# ng-runner-policy: github-hosted-primary-v1
name: Dispatch matching Lumen release
on:
  workflow_run:
    workflows: [SeerrNG Release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lumen-release-dispatch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Set up GitHub CLI
        uses: ./.github/actions/setup-gh-cli
      - name: Dispatch only the matching published stable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-lumen-release.mjs
