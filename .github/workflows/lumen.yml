# ng-runner-policy: github-hosted-primary-v1
name: Lumen validation
on:
  pull_request:
    branches: [main]
    paths: ['lumen/**', '.github/workflows/lumen.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lumen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  lumen:
    name: Build, proxy security and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install Lumen dependencies
        working-directory: lumen
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        working-directory: lumen
        run: npm audit --omit=dev --audit-level=low
      - name: Build Lumen
        working-directory: lumen
        run: npm run build
      - name: Test built unprivileged nginx, forwarding and Plex links
        working-directory: lumen
        run: npm test
        env:
          LUMEN_IMAGE_AUDIT_ARCHIVE: ${{ runner.temp }}/lumen-production-image.tar
      - name: Install current Trivy image scanner
        uses: ./.github/actions/setup-trivy
        with:
          version: latest
      - name: Reject fixable HIGH and CRITICAL production-image vulnerabilities
        run: >-
          trivy image --input "${{ runner.temp }}/lumen-production-image.tar"
          --config= --ignorefile= --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --format json
          --output "${{ runner.temp }}/lumen-image-vulnerabilities.json"
      - name: Retain production-image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-image-vulnerability-report
          path: ${{ runner.temp }}/lumen-image-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install Chromium
        working-directory: lumen
        run: npx --no-install playwright install --with-deps chromium
      - name: Test Lumen in desktop, phone and tablet viewports
        working-directory: lumen
        run: npm run test:browser -- --workers=2
      - name: Check out the pre-request TV UI baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Parent of the TV request-state UI change for a reproducible baseline.
          ref: 40a18c330e195611994a7128cccde113e49fed4a
          path: baseline-tv-request
          persist-credentials: false
      - name: Add the current request-state browser fixture to the baseline
        if: github.event_name == 'pull_request'
        run: cp lumen/tests/browser/tv-request-state.spec.ts baseline-tv-request/lumen/tests/browser/
      - name: Install baseline Lumen dependencies
        if: github.event_name == 'pull_request'
        working-directory: baseline-tv-request/lumen
        run: npm ci --ignore-scripts
      - name: Build the pre-request TV UI baseline
        if: github.event_name == 'pull_request'
        working-directory: baseline-tv-request/lumen
        run: npm run build
      - name: Capture matched pre-request TV UI screenshots
        if: github.event_name == 'pull_request'
        working-directory: baseline-tv-request/lumen
        run: >-
          npm run test:browser -- tests/browser/tv-request-state.spec.ts
          --grep @tv-request-visual --project=desktop --project=iphone
          --workers=1
        env:
          LUMEN_TV_REQUEST_BASELINE: 'true'
          LUMEN_TEST_OUTPUT: ${{ runner.temp }}/lumen-tv-request-baseline
      - name: Retain pre-request TV UI baseline evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-tv-request-baseline
          path: ${{ runner.temp }}/lumen-tv-request-baseline/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-browser-evidence
          path: lumen/test-results/
          if-no-files-found: ignore
          retention-days: 7
