# ng-runner-policy: private-jit-only-v1
name: Publish Chocolatey
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - release
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options:
          - private
      tag:
        description: Stable release tag, for example v3.41.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-chocolatey-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-chocolatey:
    name: Build and submit Chocolatey package
    if: github.ref == 'refs/heads/main' && inputs.action_tag == 'release' && inputs.runner_pool_tag == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-publish-chocolatey"]}}', github.run_id)) }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$') {
            throw "Invalid stable release tag: $tag"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require Chocolatey publisher credential
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'The CHOCOLATEY_API_KEY repository secret is required to submit the SeerrNG package.'
          }
          $apiKeyGuid = [guid]::Empty
          if (-not [guid]::TryParse($env:CHOCOLATEY_API_KEY.Trim(), [ref]$apiKeyGuid)) {
            throw 'The CHOCOLATEY_API_KEY repository secret must be a GUID-formatted Chocolatey Community Repository API key.'
          }
          Write-Output 'Chocolatey API key format validated.'

      - name: Require a published GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,publishedAt
          if ($LASTEXITCODE -ne 0) { throw "Could not verify GitHub release $env:TAG." }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft -or -not $release.publishedAt) {
            throw "Refusing to submit a Chocolatey package while GitHub release $env:TAG is still a draft."
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main for release-tag verification.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag $env:TAG is not reachable from main." }

      - name: Download and verify the Windows release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assetBase = "seerrng-$env:TAG-windows-x64"
          $archiveName = "$assetBase.zip"
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'seerrng-chocolatey-release'
          New-Item -ItemType Directory -Path $downloadDirectory -Force | Out-Null

          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $archiveName `
            --pattern "$assetBase.sha256" `
            --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) { throw "Could not download $archiveName and its checksum from the release." }

          $sidecar = Get-Content -LiteralPath (Join-Path $downloadDirectory "$assetBase.sha256") -Raw
          $escapedArchiveName = [regex]::Escape($archiveName)
          if ($sidecar -notmatch "(?m)^([a-f0-9]{64})\s+\*?$escapedArchiveName\s*$") {
            throw "The release checksum sidecar for $archiveName has an unexpected format."
          }
          $expectedSha256 = $Matches[1]
          $actualSha256 = (Get-FileHash -LiteralPath (Join-Path $downloadDirectory $archiveName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "SHA-256 mismatch for $archiveName."
          }

          "archive_sha256=$actualSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: archive

      - name: Build the Chocolatey package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'seerrng-chocolatey-package'
          & "$env:GITHUB_WORKSPACE/packaging/chocolatey/Build-Package.ps1" `
            -Version $env:VERSION `
            -ArchiveSha256 $env:ARCHIVE_SHA256 `
            -OutputDirectory $outputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'The Chocolatey package build failed.' }

      - name: Submit package to Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'The CHOCOLATEY_API_KEY repository secret is required to submit the SeerrNG package.'
          }
          $apiKeyGuid = [guid]::Empty
          if (-not [guid]::TryParse($env:CHOCOLATEY_API_KEY.Trim(), [ref]$apiKeyGuid)) {
            throw 'The CHOCOLATEY_API_KEY repository secret must be a GUID-formatted Chocolatey Community Repository API key.'
          }

          $packagePath = Join-Path (Join-Path $env:RUNNER_TEMP 'seerrng-chocolatey-package') "seerrng.$env:VERSION.nupkg"
          if (-not (Test-Path -LiteralPath $packagePath)) { throw "The package was not found at $packagePath." }

          $apiKey = $apiKeyGuid.ToString('D')
          choco push $packagePath `
            --source 'https://push.chocolatey.org/' `
            --api-key $apiKey
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey rejected the SeerrNG package submission.' }
