# ng-runner-policy: github-hosted-primary-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Review Inactive Issues and PRs
run-name: ${{ format('action:{0}:pool:{1}:dry-run:{2}', inputs.action_tag, inputs.runner_pool_tag, inputs.dry_run) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - cleanup
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options:
          - public
      dry_run:
        description: Preview labels and comments without changing reports
        type: boolean
        default: true
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stale:
    name: Mark inactive reports for maintainer review
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: "pending author's response"
          exempt-issue-labels: 'confirmed'
          days-before-stale: 30
          days-before-close: -1
          days-before-issue-close: -1
          days-before-pr-close: -1
          debug-only: ${{ inputs.dry_run }}
          stale-issue-label: 'stale'
          stale-issue-message: 'This report has had no activity for 30 days and remains open for maintainer review. Inactivity is not a resolution.'
          stale-pr-label: 'stale'
          stale-pr-message: 'This contribution has had no activity for 30 days and remains open for review and integration. Inactivity does not close it.'
