# ng-runner-policy: github-hosted-primary-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Promote stable container aliases
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - promote
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options:
          - public
permissions:
  contents: read

concurrency:
  group: seerrng-stable-container-aliases
  cancel-in-progress: false

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng

jobs:
  promote:
    name: Promote latest published stable image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(scripts/latest-published-release-tag.sh)"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify release manifest compatibility and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/ensure-release-tag-on-main.sh "$RELEASE_TAG"
          scripts/verify-container-manifest.sh --require-compatible-manifest "${GHCR_IMAGE}:${RELEASE_TAG}" linux/amd64 linux/arm64
          scripts/verify-container-manifest.sh --require-compatible-manifest "${DOCKER_HUB}:${RELEASE_TAG}" linux/amd64 linux/arm64
          docker pull --platform linux/amd64 "${GHCR_IMAGE}:${RELEASE_TAG}"
          expected_revision="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${GHCR_IMAGE}:${RELEASE_TAG}")"
          if [[ "$actual_revision" != "$expected_revision" ]]; then
            echo "Release image revision ${actual_revision} does not match ${RELEASE_TAG} (${expected_revision})." >&2
            exit 1
          fi
          docker image rm "${GHCR_IMAGE}:${RELEASE_TAG}"

      - name: Promote and verify stable aliases
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: bash scripts/promote-container-aliases.sh "$VERSION" "$GHCR_IMAGE" "$DOCKER_HUB"

      - name: Mirror stable aliases to the legacy GHCR path
        # Installs created from the retired template still pull this path and
        # never see a template change, so it keeps following the latest stable
        # image. Needs GHCR_LEGACY_TOKEN, or Actions write access on the legacy
        # package; a push failure warns without failing the release.
        env:
          LEGACY_GHCR_IMAGE: ghcr.io/snapetech/seerrng
          LEGACY_GHCR_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          set -uo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          LEGACY_GHCR_TOKEN="$(printf '%s' "$LEGACY_GHCR_TOKEN" | tr -d '[:space:]')"
          if ! printf '%s' "$LEGACY_GHCR_TOKEN" | docker login ghcr.io -u snapetech --password-stdin >/dev/null \
            || ! bash scripts/mirror-legacy-ghcr-aliases.sh "$VERSION" "$GHCR_IMAGE" "$LEGACY_GHCR_IMAGE"; then
            echo "::warning::Legacy ghcr.io/snapetech/seerrng aliases were not updated (login or push failed); installs on the retired path stay on an older image. GHCR_LEGACY_TOKEN must be a classic PAT with write:packages."
          fi
