# ng-runner-policy: github-hosted-primary-v1
name: Trivy filesystem scan
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - trivy
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options:
          - public
permissions:
  contents: read

concurrency:
  group: ng-scan-trivy-filesystem-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  trivy:
    name: Trivy source, dependency, and configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Trivy
        uses: ./.github/actions/setup-trivy
        with:
          version: v0.76.2

      - name: Scan applicable repository files
        env:
          TRIVY_EXIT_CODE: 1
          REQUIRE_TRIVY: 1
        run: ./scripts/security-scan-local.sh --trivy-only --ci

