# ng-runner-policy: github-hosted-primary-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cypress Tests
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_call:
    inputs:
      pr_sha:
        description: Exact trusted owner PR head SHA to validate
        required: false
        type: string
    secrets:
      CYPRESS_RECORD_KEY:
        required: false
  workflow_dispatch:
    inputs:

      action_tag:
        description: Action tag for this workflow
        required: true
        type: choice
        options:
          - run
      runner_pool_tag:
        description: GitHub-hosted runner pool tag
        required: true
        type: choice
        options:
          - public
permissions:
  contents: read

concurrency:
  group: cypress-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  cypress-run:
    name: Cypress suite
    timeout-minutes: 90
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Typecheck Cypress fixtures and commands
        run: pnpm cypress:typecheck

      - name: Cache Cypress binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/seerrng-cypress-cache
          key: ${{ runner.os }}-cypress-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-store-

      - name: Install Cypress binary
        env:
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}/seerrng-cypress-cache
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify

      - name: Configure Cypress runtime directory
        run: printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-cypress-runtime-config" >> "$GITHUB_ENV"

      - name: Prepare Cypress runtime configuration
        run: pnpm cypress:prepare

      - name: Export external runtime configuration
        id: export-config
        run: |
          printf 'external_config=%s\n' "$(node scripts/export-external-config.mjs "$CONFIG_DIRECTORY/settings.json")" >> "$GITHUB_OUTPUT"

      - name: Build Cypress application
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
        run: pnpm cypress:build

      - name: Detect Cypress Cloud recording availability
        id: cypress-recording
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$CYPRESS_RECORD_KEY" ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Cypress suite with Cypress Cloud
        if: steps.cypress-recording.outputs.enabled == 'true'
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          install: false
          start: env E2E_TESTS=true pnpm start
          wait-on: 'http://localhost:5056'
          config: baseUrl=http://localhost:5056
          record: true
          group: SeerrNG Cypress suite
          ci-build-id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}/seerrng-cypress-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message || inputs.pr_sha || github.sha }}
          COMMIT_INFO_SHA: ${{ inputs.pr_sha || github.sha }}

      - name: Run Cypress suite without Cypress Cloud
        if: steps.cypress-recording.outputs.enabled != 'true'
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          install: false
          start: env E2E_TESTS=true pnpm start
          wait-on: 'http://localhost:5056'
          config: baseUrl=http://localhost:5056
          record: false
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          CYPRESS_CACHE_FOLDER: ${{ runner.temp }}/seerrng-cypress-cache
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056

