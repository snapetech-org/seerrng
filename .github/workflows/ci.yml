# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action, inputs.runner_pool) ||
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'private') }}

on:
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        type: choice
        required: true
        options: [ci, publish-image]
      runner_pool:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]
      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        type: string
        required: false
      pr_sha:
        description: Exact owner PR head SHA
        type: string
        required: false
      target_run_id:
        description: Metadata-only pull_request_target run ID
        type: string
        required: false

permissions:
  contents: read

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng

concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (startsWith(github.event.label.name, 'action:') ||
       startsWith(github.event.label.name, 'pool:')) &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          target_run_id = os.environ["TARGET_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          labels = json.loads(os.environ["PR_LABELS_JSON"])
          action_labels = [
              label for label in labels
              if isinstance(label, str) and label.startswith("action:")
          ]
          pool_labels = [
              label for label in labels
              if isinstance(label, str) and label.startswith("pool:")
          ]
          if action_labels != ["action:ci"] or pool_labels != ["pool:private"]:
              raise SystemExit("add exactly action:ci and pool:private labels")
          if repository != "snapetech-org/seerrng":
              raise SystemExit("unexpected repository")
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("invalid pull request number")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", target_run_id):
              raise SystemExit("invalid metadata run ID")

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "action": "ci",
                  "runner_pool": "private",
                  "pr_number": number,
                  "pr_sha": sha,
                  "target_run_id": target_run_id,
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/seerrng/actions/workflows/ci.yml/dispatches",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          PY

  release-notes:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')
    name: Release-note contract
    timeout-minutes: 10
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Manual validation compares the selected main commit to its parent.
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Verify stable container alias policy
        run: node scripts/check-container-alias-policy.mjs

      - name: Validate release-note fragment or explicit opt-out
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify "${HEAD_SHA}^1")"
          body_file="$RUNNER_TEMP/pr-body.md"
          if git diff --quiet "$base_sha" "$HEAD_SHA" -- release-notes; then
            printf '%s' 'release-note: none' > "$body_file"
          else
            : > "$body_file"
          fi
          node scripts/check-release-notes.mjs \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          node scripts/check-changelog-tags.mjs

  i18n-and-tooling:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: i18n and tooling tests
    timeout-minutes: 45
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-i18n-and-tooling"]}}', github.run_id)) }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-migration
          POSTGRES_DB: seerrng_migration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d seerrng_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          # Tooling tests validate release tags as well as the current tree.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Helm for chart security tests
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Check translations
        run: pnpm i18n:check

      - name: Check tooling tests
        env:
          SEERR_MIGRATION_TEST_POSTGRES_URL: postgresql://postgres:ci-only-migration@127.0.0.1:${{ job.services.postgres.ports[5432] }}/seerrng_migration_test
        run: pnpm test:tooling

  test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: Lint, typecheck, and production build
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build

      - name: Check bundle budget
        run: pnpm bundle:check

  unit-test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: Vitest shard ${{ matrix.shard }} of 4
    timeout-minutes: 75
    # Owner-PR labels: gha-{0}-unit-test-shard-1, gha-{0}-unit-test-shard-2,
    # gha-{0}-unit-test-shard-3, gha-{0}-unit-test-shard-4.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-{1}"]}}', github.run_id, inputs.pr_number != '' && matrix.owner_pr_suffix || format('{0}-unit-test', strategy.job-index))) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: 1
            owner_pr_suffix: unit-test-shard-1
          - shard: 2
            owner_pr_suffix: unit-test-shard-2
          - shard: 3
            owner_pr_suffix: unit-test-shard-3
          - shard: 4
            owner_pr_suffix: unit-test-shard-4
    container:
      image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run Vitest shard
        env:
          CI: true
        run: pnpm test:ci --shard=${{ matrix.shard }}/4

  node-test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: Native TypeScript tests
    timeout-minutes: 75
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-node-test"]}}', github.run_id)) }}
    container:
      image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run native Node test suite
        env:
          CI: true
        run: pnpm test:node --test-concurrency=4

  jellyfin-plugin:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: Build and smoke test Jellyfin bridge plugin
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-jellyfin-plugin"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 9.0.x

      - name: Test Jellyfin smoke-test startup retries
        run: python3 -m unittest discover -s integrations/jellyfin-plugin/tests -p 'test_*.py' -v

      - name: Build plugin
        run: >-
          dotnet publish
          integrations/jellyfin-plugin/SeerrNG.JellyfinBridge.csproj
          --configuration Release
          --output artifacts/seerrng-jellyfin-bridge

      - name: Smoke test plugin in Jellyfin 10.11.11
        run: >-
          python3 integrations/jellyfin-plugin/smoke-test.py
          --plugin-output artifacts/seerrng-jellyfin-bridge

  playwright:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
        github.actor == 'github-actions[bot]' && inputs.action == 'ci') ||
       (inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')))
    name: Playwright browser tests
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-playwright"]}}', github.run_id)) }}
    permissions:
      contents: read
    env:
      PORT: '5055'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5055
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Playwright runtime
        run: |
          printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-playwright-runtime-config" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_JSON_OUTPUT_FILE=%s\n' "$RUNNER_TEMP/seerrng-playwright-result.json" >> "$GITHUB_ENV"

      - name: Prepare Playwright runtime configuration
        run: pnpm cypress:prepare

      - name: Build app for browser tests
        run: pnpm build

      - name: Run Playwright suite
        env:
          CI: true
        run: pnpm exec playwright test --reporter=json

  cypress:
    name: Cypress browser tests
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')
    permissions:
      contents: read
    uses: ./.github/workflows/cypress.yml

  test-docs:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')
    name: Build docs website
    permissions:
      contents: read
    uses: ./.github/workflows/test-docs.yml

  docs-links:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')
    name: Check documentation links
    permissions:
      contents: read
    uses: ./.github/workflows/docs-link-check.yml

  helm:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pr_number == '' && (inputs.action == 'ci' || inputs.action == 'publish-image')
    name: Lint and test Helm charts
    permissions:
      contents: read
    uses: ./.github/workflows/lint-helm-charts.yml

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs:
      - i18n-and-tooling
      - test
      - unit-test
      - node-test
      - jellyfin-plugin
      - playwright
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.action == 'ci' &&
      inputs.runner_pool == 'private' && inputs.pr_number != '' &&
      inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RESULT: >-
            ${{ (needs['i18n-and-tooling'].result == 'success' &&
                 needs.test.result == 'success' &&
                 needs['unit-test'].result == 'success' &&
                 needs['node-test'].result == 'success' &&
                 needs['jellyfin-plugin'].result == 'success' &&
                 needs.playwright.result == 'success') && 'success' || 'failure' }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          sha = os.environ["PR_SHA"]
          result = os.environ["VALIDATION_RESULT"]
          run_id = os.environ["VALIDATION_RUN_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("invalid validation run ID")
          conclusion = "success" if result == "success" else "failure"
          payload = json.dumps({
              "name": "SeerrNG owner PR validation",
              "head_sha": sha,
              "external_id": run_id,
              "status": "completed",
              "conclusion": conclusion,
              "details_url": (
                  "https://github.com/snapetech-org/seerrng/actions/runs/" + run_id
              ),
              "output": {
                  "title": "SeerrNG validation " + conclusion,
                  "summary": "See the linked main-pinned workflow run for exact-SHA validation details.",
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/seerrng/check-runs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f"check creation returned HTTP {response.status}")
          PY

  publish:
    name: Publish multi-arch image
    timeout-minutes: 90
    needs:
      - release-notes
      - i18n-and-tooling
      - test
      - unit-test
      - node-test
      - jellyfin-plugin
      - playwright
      - cypress
      - test-docs
      - docs-links
      - helm
    if: >-
      github.ref == 'refs/heads/main' && inputs.pr_number == '' &&
      inputs.action == 'publish-image' && inputs.runner_pool == 'private'
    concurrency:
      group: seerrng-main-image-publish
      cancel-in-progress: false
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-publish"]}}', github.run_id)) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.resolve-digest.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image channel
        id: channel
        run: echo "CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Resolve base images with retry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_images < <(
            awk '
              toupper($1) == "FROM" {
                image = ""
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^--/) {
                    continue
                  }
                  image = $i
                  break
                }
                if (image != "") {
                  images[image] = 1
                }
                for (i = 2; i < NF; i++) {
                  if (toupper($i) == "AS") {
                    aliases[$(i + 1)] = 1
                  }
                }
              }
              END {
                for (image in images) {
                  if (!(image in aliases)) {
                    print image
                  }
                }
              }
            ' Dockerfile | sort -u
          )
          for image in "${base_images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Resolving ${image} (attempt ${attempt}/5)"
              if docker buildx imagetools inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to resolve ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: Build & Push (multi-arch, single tag)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.channel.outputs.CHANNEL }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.TIMESTAMP }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${COMMIT_TAG}"
            --build-arg "BUILD_VERSION=${BUILD_VERSION}"
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3; do
            echo "Building and pushing image (attempt ${attempt}/3)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Verify published architectures
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:sha-${GITHUB_SHA::7}" linux/amd64 linux/arm64

      - name: Resolve published image digest
        id: resolve-digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving published image digest (attempt ${attempt}/5)"
            if digest=$(docker buildx imagetools inspect "${image_name}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the published image digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  scan-main-image:
    name: Scan main image (${{ matrix.platform }})
    if: >-
      github.ref == 'refs/heads/main' && inputs.pr_number == '' &&
      inputs.action == 'publish-image' && inputs.runner_pool == 'private' && needs.publish.result == 'success'
    needs: [publish]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-{1}-scan-main-image"]}}', github.run_id, strategy.job-index)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-main-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}"

      - name: Preserve Trivy scan result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-main-${{ matrix.suffix }}-sarif
          path: trivy-main-${{ matrix.suffix }}.sarif
          if-no-files-found: warn
          retention-days: 7
