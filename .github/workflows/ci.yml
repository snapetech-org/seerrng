# ng-runner-policy: private-jit-only-v1
---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: SeerrNG CI
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [validate, publish-image]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]

permissions:
  contents: read

env:
  DOCKER_HUB: snapetech/seerrng
  GHCR_IMAGE: ghcr.io/snapetech-org/seerrng

concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  release-notes:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Release-note contract
    timeout-minutes: 10
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release-note validation compares the workflow-dispatch commit to its parent.
          fetch-depth: 2
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Verify stable container alias policy
        run: node scripts/check-container-alias-policy.mjs

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BODY: ${{ github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            base_sha="$(git rev-parse --verify "${HEAD_SHA}^1")"
          fi
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git diff --quiet "$base_sha" "$HEAD_SHA" -- release-notes; then
            printf '%s' 'release-note: none' > "$body_file"
          fi
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          node scripts/check-release-notes.mjs \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          node scripts/check-changelog-tags.mjs

  i18n-and-tooling:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: i18n and tooling tests
    timeout-minutes: 45
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-migration
          POSTGRES_DB: seerrng_migration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d seerrng_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tooling tests validate release tags as well as the current tree.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Helm for chart security tests
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Check translations
        run: pnpm i18n:check

      - name: Check tooling tests
        env:
          SEERR_MIGRATION_TEST_POSTGRES_URL: postgresql://postgres:ci-only-migration@127.0.0.1:${{ job.services.postgres.ports[5432] }}/seerrng_migration_test
        run: pnpm test:tooling

  test:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Lint, typecheck, and production build
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build

      - name: Check bundle budget
        run: pnpm bundle:check

  unit-test:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Vitest shard ${{ matrix.shard }} of 4
    timeout-minutes: 75
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run Vitest shard
        env:
          CI: true
        run: pnpm test:ci --shard=${{ matrix.shard }}/4

  node-test:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Native TypeScript tests
    timeout-minutes: 75
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    container:
      image: node:24.22.1-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Run native Node test suite
        env:
          CI: true
        run: pnpm test:node --test-concurrency=4

  jellyfin-plugin:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Build and smoke test Jellyfin bridge plugin
    timeout-minutes: 30
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 9.0.x

      - name: Test Jellyfin smoke-test startup retries
        run: python3 -m unittest discover -s integrations/jellyfin-plugin/tests -p 'test_*.py' -v

      - name: Build plugin
        run: >-
          dotnet publish
          integrations/jellyfin-plugin/SeerrNG.JellyfinBridge.csproj
          --configuration Release
          --output artifacts/seerrng-jellyfin-bridge

      - name: Smoke test plugin in Jellyfin 10.11.11
        run: >-
          python3 integrations/jellyfin-plugin/smoke-test.py
          --plugin-output artifacts/seerrng-jellyfin-bridge

  playwright:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Playwright browser tests
    timeout-minutes: 60
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    permissions:
      contents: read
    env:
      PORT: '5055'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5055
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        env:
          CI: true
          CYPRESS_INSTALL_BINARY: 0
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure Playwright runtime
        run: |
          printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-playwright-runtime-config" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_JSON_OUTPUT_FILE=%s\n' "$RUNNER_TEMP/seerrng-playwright-result.json" >> "$GITHUB_ENV"

      - name: Prepare Playwright runtime configuration
        run: pnpm cypress:prepare

      - name: Build app for browser tests
        run: pnpm build

      - name: Run Playwright suite
        env:
          CI: true
        run: pnpm exec playwright test --reporter=json

  cypress:
    name: Cypress browser tests
    if: >-
      (inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/cypress.yml
    secrets:
      CYPRESS_RECORD_KEY: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY || '' }}

  test-docs:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Build docs website
    permissions:
      contents: read
    uses: ./.github/workflows/test-docs.yml

  docs-links:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Check documentation links
    permissions:
      contents: read
    uses: ./.github/workflows/docs-link-check.yml

  helm:
    if: inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image'
    name: Lint and test Helm charts
    permissions:
      contents: read
    uses: ./.github/workflows/lint-helm-charts.yml
  publish:
    name: Publish multi-arch image
    timeout-minutes: 90
    needs:
      - release-notes
      - i18n-and-tooling
      - test
      - unit-test
      - node-test
      - jellyfin-plugin
      - playwright
      - cypress
      - test-docs
      - docs-links
      - helm
    if: >-
      (inputs.action_tag == 'validate' || inputs.action_tag == 'publish-image') && (github.ref == 'refs/heads/main' && inputs.action_tag == 'publish-image' && inputs.runner_pool_tag == 'private')
    concurrency:
      group: seerrng-main-image-publish
      cancel-in-progress: false
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.resolve-digest.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Image channel
        id: channel
        run: echo "CHANNEL=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha
          labels: |
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}

      - name: Resolve base images with retry
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_images < <(
            awk '
              toupper($1) == "FROM" {
                image = ""
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^--/) {
                    continue
                  }
                  image = $i
                  break
                }
                if (image != "") {
                  images[image] = 1
                }
                for (i = 2; i < NF; i++) {
                  if (toupper($i) == "AS") {
                    aliases[$(i + 1)] = 1
                  }
                }
              }
              END {
                for (image in images) {
                  if (!(image in aliases)) {
                    print image
                  }
                }
              }
            ' Dockerfile | sort -u
          )
          for image in "${base_images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Resolving ${image} (attempt ${attempt}/5)"
              if docker buildx imagetools inspect "$image" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to resolve ${image} after ${attempt} attempts" >&2
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done

      - name: Build & Push (multi-arch, single tag)
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta.outputs.labels }}
          COMMIT_TAG: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.channel.outputs.CHANNEL }}
          SOURCE_DATE_EPOCH: ${{ steps.ts.outputs.TIMESTAMP }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --build-arg "COMMIT_TAG=${COMMIT_TAG}"
            --build-arg "BUILD_VERSION=${BUILD_VERSION}"
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
            --cache-from type=gha,scope=linux/amd64
            --cache-from type=gha,scope=linux/arm64
            --cache-to type=gha,mode=max
            --provenance mode=max
          )

          while IFS= read -r tag; do
            [ -n "$tag" ] && build_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"

          while IFS= read -r label; do
            [ -n "$label" ] && build_args+=(--label "$label")
          done <<< "$IMAGE_LABELS"

          for attempt in 1 2 3; do
            echo "Building and pushing image (attempt ${attempt}/3)"
            if docker buildx build "${build_args[@]}" .; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Image build/push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Verify published architectures
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          scripts/verify-container-manifest.sh --require-provenance "${image_name}:sha-${GITHUB_SHA::7}" linux/amd64 linux/arm64

      - name: Resolve published image digest
        id: resolve-digest
        shell: bash
        run: |
          set -euo pipefail
          image_name="${GHCR_IMAGE}"
          for attempt in 1 2 3 4 5; do
            echo "Resolving published image digest (attempt ${attempt}/5)"
            if digest=$(docker buildx imagetools inspect "${image_name}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest.Digest}}' | tr -d '"') &&
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to resolve the published image digest after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

  scan-main-image:
    name: Scan main image (${{ matrix.platform }})
    if: >-
      inputs.action_tag == 'publish-image' && inputs.runner_pool_tag == 'private' && (github.ref == 'refs/heads/main' && needs.publish.result == 'success')
    needs: [publish]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}"]}}', github.run_id)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Run Trivy image scan
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          trivy image \
            --platform "$PLATFORM" \
            --format sarif \
            --output "trivy-main-${{ matrix.suffix }}.sarif" \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${GHCR_IMAGE}@${IMAGE_DIGEST}"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-main-${{ matrix.suffix }}.sarif
          category: trivy-main-${{ matrix.suffix }}
