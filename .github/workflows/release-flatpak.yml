# ng-runner-policy: github-hosted-primary-v1
name: Build Flatpak
run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options:
          - release
      runner_pool_tag:
        description: GitHub-hosted runner pool
        required: true
        type: choice
        options:
          - public
      tag:
        description: Release tag, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  flatpak:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          [[ "$tag" != *-* ]] || { echo "Stable package channels reject pre-release tag: $tag" >&2; exit 2; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/ensure-release-tag-on-main.sh "$TAG"
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xz-utils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            if gh release download "${{ steps.version.outputs.tag }}" -R "$GITHUB_REPOSITORY" --pattern "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --clobber; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Prepare Flatpak sources
        run: |
          set -euo pipefail
          mkdir -p flatpak-src/seerrng flatpak-src/node
          tar -xzf "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --strip-components=1 -C flatpak-src/seerrng
          curl -fsSLo node.tar.xz https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz
          echo "48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75  node.tar.xz" | sha256sum -c -
          tar -xJf node.tar.xz --strip-components=1 -C flatpak-src/node
      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          flatpak-builder --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/io.github.snapetech.seerrng.yml
          flatpak build-bundle flatpak-repo "SeerrNG-${{ steps.version.outputs.version }}-x86_64.flatpak" io.github.snapetech.seerrng
          sha256sum "SeerrNG-${{ steps.version.outputs.version }}-x86_64.flatpak" > "SeerrNG-${{ steps.version.outputs.version }}-x86_64.flatpak.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            SeerrNG-*.flatpak
            SeerrNG-*.flatpak.sha256
