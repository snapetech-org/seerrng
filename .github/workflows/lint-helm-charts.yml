---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint and Test Charts

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: helm-charts-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  lint-test:
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng","ng-main-run-{0}","gha-{0}-lint-test"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Verify generated chart documentation
        env:
          HELM_DOCS_IMAGE: jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
        run: |
          set -euo pipefail
          while IFS= read -r chart; do
            [[ -n "$chart" ]] || continue
            case "$chart" in
              charts/*) ;;
              *)
                echo "Unexpected chart path: $chart" >&2
                exit 1
                ;;
            esac

            generated=$(mktemp "$RUNNER_TEMP/helm-docs.XXXXXX")
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE:/helm-docs:ro" \
              "$HELM_DOCS_IMAGE" \
              --chart-search-root "$chart" \
              --dry-run > "$generated"
            diff --unified "$chart/README.md" "$generated"
          done < <(find charts -type f -name Chart.yaml -printf '%h\n' | sort -u)

      - name: Lint every Helm chart
        run: ct lint --all --validate-maintainers=false

