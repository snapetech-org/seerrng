name: Set up pinned GitHub CLI
description: Install the verified GitHub CLI binary for release runners.
runs:
  using: composite
  steps:
    - name: Install GitHub CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS:-}" != 'Linux' || "${RUNNER_ARCH:-}" != 'X64' ]]; then
          echo 'The pinned GitHub CLI installer currently supports Linux x64 runners.' >&2
          exit 1
        fi

        version='2.102.1'
        archive_name="gh_${version}_linux_amd64.tar.gz"
        install_root="${RUNNER_TEMP}/github-cli-${version}"
        archive="${install_root}/${archive_name}"
        mkdir -p "$install_root"
        expected_checksum='77b9e297e94c50336823d0f84de7ef1be60cba704601fa0d98f129f47a94987b'
        python3 "$GITHUB_ACTION_PATH/download-release-asset.py" \
          --repository cli/cli --tag "v${version}" --asset "$archive_name" \
          --asset-id 660284822 --sha256 "$expected_checksum" \
          --output "$archive" --extract-to "$install_root"
        checksum_output="$(sha256sum "$archive")"
        actual_checksum="${checksum_output%% *}"
        if [[ "$actual_checksum" != "$expected_checksum" ]]; then
          echo 'The downloaded GitHub CLI archive failed SHA-256 verification.' >&2
          exit 1
        fi
        bin_directory="${install_root}/gh_${version}_linux_amd64/bin"
        test -x "${bin_directory}/gh"
        printf '%s\n' "$bin_directory" >> "$GITHUB_PATH"
        "${bin_directory}/gh" --version
